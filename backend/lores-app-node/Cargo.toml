[package]
name = "lores-app-node"
version = "0.1.0"
edition = "2021"

[dependencies]
lores-p2panda-client = "0.3.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["sync"] }
tonic = "0.14"
tracing = "0.1"
