[package]
name = "coop-cloud-docker-apps"
version = "0.3.0"
authors = ["Jade Ambrose", "Merri-bek Tech Inc."]
edition = "2024"
rust-version = "1.96"
description = "A library to list running apps on this server (or server cluster) installed with Docker Swarm via Co-op Cloud"
readme = "README.md"
homepage = "https://lores.tech/"
repository = "https://github.com/local-resilience-tech/lores-node/"
keywords = ["coop-cloud", "lores", "docker", "swarm"]
categories = ["api-bindings"]
publish = true
license-file = "LICENSE.txt"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
