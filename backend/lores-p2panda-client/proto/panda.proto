syntax = "proto3";

package lores.panda.v2;

service Panda {
  // Publish an operation to a region. Returns only after the operation has been
  // persisted by the local p2panda node, guaranteeing it will eventually be
  // propagated to peers regardless of their current availability.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Subscribe to a region+namespace topic and receive a stream of events.
  // By default the stream delivers only operations that arrive after the
  // subscription is established. If `replay` is true, the server first streams
  // every persisted operation for the topic from the beginning of the log, then
  // continues with live operations.
  //
  // p2panda emits `ReplayStarted` and `ReplayEnded` lifecycle events around
  // the historical replay. The client can use `ReplayEnded` to know when it
  // has caught up and is receiving live operations. HTTP/2 flow control
  // provides natural backpressure: the server will not send faster than the
  // client reads.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeEvent);

  // Returns information about the connected server node.
  rpc Info(InfoRequest) returns (InfoResponse);

  // Returns information about a node in the same region.
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);

}

message PublishRequest {
  // String identifying this application consistantly across all nodes in the region.
  string app_id = 1;
  // String identifying this specific app instance on this server. Use something that
  // can be rotated if you want to reset the app's state (e.g. a fresh database).
  string instance_id = 2;
  // Encoded operation payload (e.g. CBOR).
  bytes payload = 3;
  // Optional client-assigned idempotency key. If present, the server will
  // deduplicate within the retention window: a second Publish with the same
  // (app_id, instance_id, idempotency_key) returns success without
  // re-inserting the operation.
  bytes idempotency_key = 4;
}

message PublishResponse {
  // 32-byte p2panda operation hash assigned by the node.
  bytes operation_id = 1;
  // 32-byte p2panda public key of the node that persisted the operation.
  bytes node_id = 2;
}

message SubscribeRequest {
  // String identifying this application consistantly across all nodes in the region.
  string app_id = 1;
  // String identifying this specific app instance on this server. Use something that
  // can be rotated if you want to reset the app's state (e.g. a fresh database).
  string instance_id = 2;
  // If true, the server first replays all persisted operations for the topic
  // before streaming live operations. Operations are delivered in order and
  // there is no gap between the historical replay and the live feed.
  bool replay = 3;
}

message OperationEvent {
  // 32-byte p2panda topic identifier the operation belongs to.
  bytes topic_id = 1;
  // 32-byte author public key.
  bytes author = 2;
  // 32-byte operation hash used as a unique identifier.
  bytes operation_id = 3;
  // Unix timestamp in milliseconds.
  uint64 timestamp = 4;
  // Encoded operation payload (e.g. CBOR).
  bytes payload = 5;
}

// Emitted once at the beginning of a replay, before any historical operations.
message ReplayStarted {
  // Number of operations that will be replayed.
  uint32 total_operations = 1;
}

// Emitted once after all historical operations have been replayed. From this
// point on the stream delivers live operations (until the next replay).
message ReplayEnded {}

// Events delivered by the `Subscribe` stream. The oneof mirrors p2panda's
// `StreamEvent::ReplayStarted` and `StreamEvent::ReplayEnded` lifecycle events.
message SubscribeEvent {
  oneof event {
    // A regular operation, either historical (before `ReplayEnded`) or live
    // (after `ReplayEnded`).
    OperationEvent operation = 1;

    // Historical replay has started. Emitted only when `replay = true`.
    ReplayStarted replay_started = 2;

    // Historical replay has finished. Emitted only when `replay = true`.
    ReplayEnded replay_ended = 3;
  }
}

message InfoRequest {
  string app_id = 1;
  string instance_id = 2;
}

message RegionInfo {
  // 32-byte region identifier.
  bytes region_id = 1;
  optional string slug = 2;
  optional string name = 3;
}

message InfoResponse {
  // 32-byte p2panda public key of this node.
  bytes node_id = 1;
  RegionInfo region = 2;
}

message GetNodeRequest {
  string app_id = 1;
  string instance_id = 2;
  // Hex-encoded node public key to look up.
  string node_id = 3;
}

message GetNodeResponse {
  string node_id = 1;
  optional string name = 2;
  optional string domain_on_internet = 3;
}

