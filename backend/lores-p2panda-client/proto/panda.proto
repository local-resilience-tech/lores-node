syntax = "proto3";

package lores.panda.v2;

service Panda {
  // Publish an operation to a region. Returns only after the operation has been
  // persisted by the local p2panda node, guaranteeing it will eventually be
  // propagated to peers regardless of their current availability.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Subscribe to a region+namespace topic and receive a stream of operations.
  // The stream delivers only operations that arrive after the subscription is
  // established. HTTP/2 flow control provides natural backpressure: the server
  // will not send faster than the client reads.
  rpc Subscribe(SubscribeRequest) returns (stream OperationEvent);

  // Returns information about the connected server node.
  rpc Info(InfoRequest) returns (InfoResponse);

  // Returns information about a node in the same region.
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);

}

message PublishRequest {
  // String identifying this application consistantly across all nodes in the region.
  string app_id = 1;
  // String identifying this specific app instance on this server. Use something that
  // can be rotated if you want to reset the app's state (e.g. a fresh database).
  string instance_id = 2;
  // Encoded operation payload (e.g. CBOR).
  bytes payload = 3;
  // Optional client-assigned idempotency key. If present, the server will
  // deduplicate within the retention window: a second Publish with the same
  // (app_id, instance_id, idempotency_key) returns success without
  // re-inserting the operation.
  bytes idempotency_key = 4;
}

message PublishResponse {
  // 32-byte p2panda operation hash assigned by the node.
  bytes operation_id = 1;
  // 32-byte p2panda public key of the node that persisted the operation.
  bytes node_id = 2;
}

message SubscribeRequest {
  // String identifying this application consistantly across all nodes in the region.
  string app_id = 1;
  // String identifying this specific app instance on this server. Use something that
  // can be rotated if you want to reset the app's state (e.g. a fresh database).
  string instance_id = 2;
}

message OperationEvent {
  // 32-byte p2panda topic identifier the operation belongs to.
  bytes topic_id = 1;
  // 32-byte author public key.
  bytes author = 2;
  // 32-byte operation hash used as a unique identifier.
  bytes operation_id = 3;
  // Unix timestamp in milliseconds.
  uint64 timestamp = 4;
  // Encoded operation payload (e.g. CBOR).
  bytes payload = 5;
}

message InfoRequest {
  string app_id = 1;
  string instance_id = 2;
}

message RegionInfo {
  // 32-byte region identifier.
  bytes region_id = 1;
  optional string slug = 2;
  optional string name = 3;
}

message InfoResponse {
  // 32-byte p2panda public key of this node.
  bytes node_id = 1;
  RegionInfo region = 2;
}

message GetNodeRequest {
  string app_id = 1;
  string instance_id = 2;
  // Hex-encoded node public key to look up.
  string node_id = 3;
}

message GetNodeResponse {
  string node_id = 1;
  optional string name = 2;
  optional string domain_on_internet = 3;
}

