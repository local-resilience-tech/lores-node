[package]
name = "lores-p2panda-dev-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lores-p2panda-dev-server"
path = "src/main.rs"

[dependencies]
futures = "0.3"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"
