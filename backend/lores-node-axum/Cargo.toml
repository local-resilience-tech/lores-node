[package]
name = "lores-node"
version = "0.23.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.5", features = ["ws"] }
axum-login = "0.18.0"
chrono = { version = "0.4.42", features = ["serde"] }
confy = "2.0.0"
futures-util = "0.3.31"
lazy_static = "1.5.0"
password-auth = "1.0.0"
pwgen2 = "0.7.3"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.145"
short-uuid = "0.2.0"
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-native-tls",
  "sqlite",
  "chrono",
] }
thiserror = { workspace = true }
time = "0.3.44"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tower-sessions = { version = "0.15", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa = "5.3.1"
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = "1.18.1"
hex = { workspace = true }
lores-p2panda = { path = "../lores-p2panda" }
lores-p2panda-server = { path = "../lores-p2panda-server" }
coop-cloud-docker-apps = { path = "../coop-cloud-docker-apps" }
p2panda-core = { workspace = true }
tonic = { workspace = true }
rand = "0.10.0"
regex = "1.12.3"
